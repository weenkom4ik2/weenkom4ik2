name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *" # Запуск каждый день в полночь
  workflow_dispatch: # Позволяет запускать вручную

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Важно: дает права на запись в ветку output
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#DDA0DD&color_dots=#f0e6ff,#e6d0ff,#d4b3ff,#b380ff,#8a2be2
            dist/github-snake-dark.svg?color_snake=#DDA0DD&color_dots=#f0e6ff,#e6d0ff,#d4b3ff,#b380ff,#8a2be2&palette=github-dark

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
