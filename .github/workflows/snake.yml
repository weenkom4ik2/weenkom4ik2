name: Generate Multi-Style Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate Snake
        uses: Pro-Bandey/multi-style-snake-action@main
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist # Проверьте папку, куда экшен сохраняет файлы, возможно нужно указать другую
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
