name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # %23 — это символ #, который безопасен для YAML
          # Для темной темы берем яркие цвета (светло-сиреневый -> насыщенный фиолетовый)
          outputs: |
            dist/github-snake.svg?color_snake=%238A2BE2&color_dots=%23f4ecff,%23e2ccff,%23c499ff,%239966ff,%236633cc
            dist/github-snake-dark.svg?color_snake=%23DDA0DD&color_dots=%23f4ecff,%23e2ccff,%23c499ff,%239966ff,%236633cc&palette=github-dark

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
